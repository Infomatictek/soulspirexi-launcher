name: Build Client Launcher

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_channel:
        description: "Optional GitHub Release channel to publish after all CI gates pass (never publishes failed builds)"
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "testing-core-ui"
          - "stable"
      release_tag:
        description: "Release version tag (e.g. v2.2.0-testing.core-ui.1 or v2.2.0; required when publish_channel != none)"
        required: false
        default: ""
        type: string

concurrency:
  group: build-launcher-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
      should_build_native: ${{ steps.changes.outputs.should_build_native }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Python unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Lua addon unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'lupa==2.8'
          python tests/run_soul_lua_tests.py
          python -m unittest discover -s tests -p "test_battlelens.py" -v

      - name: Verify launcher manifest (strict read-only)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-launcher-manifest.py
          git diff --exit-code

      - name: Determine whether Windows builds are required
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_build_native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi

          if [[ -z "$base_ref" ]] || [[ "$base_ref" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_build_native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base_ref" HEAD)"
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -Eq '^(SoulspireLauncher/|SoulspireUpdater/|SoulspireLauncher\.Tests/|SoulspireLauncher\.sln|keys/|manifest\.json|channels/launcher-releases/|dat-overlay/|addons/|plugins/|soulspire_native/|scripts/|tests/|\.github/workflows/build-launcher\.yml)'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No launcher/client/manifest files changed; skipping redundant Windows launcher build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" | grep -Eq '^(soulspire_native/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|def|cmd|bat|ps1)|\.github/workflows/build-launcher\.yml|scripts/verify-soulspire-native-dll\.py|scripts/publish-testing-channel\.py|scripts/verify-launcher-manifest\.py)$'; then
            echo "should_build_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "No soulspire_native C++ source files changed; skipping soulspire_native.dll build."
            echo "should_build_native=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: verify-manifest
    if: needs.verify-manifest.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore SoulspireLauncher.sln

      - name: Build solution
        run: dotnet build SoulspireLauncher.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test SoulspireLauncher.sln -c Release --no-build --verbosity normal

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve launcher build version and channel
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $refName = "${{ github.ref_name }}"
          $dispatchChannel = "${{ inputs.publish_channel }}"
          $dispatchTag = "${{ inputs.release_tag }}"

          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = $refName
          } elseif ($dispatchTag -and $dispatchTag.StartsWith("v")) {
            $tag = $dispatchTag.Trim()
          } else {
            $tag = "v2.2.0-testing.core-ui.${{ github.run_number }}"
          }

          if ($dispatchChannel -and $dispatchChannel -ne "none") {
            $channel = $dispatchChannel
          } elseif ($tag -match "-testing\.core-ui") {
            $channel = "testing-core-ui"
          } elseif ($tag -match "-(testing|rc|beta|alpha)") {
            $channel = "testing"
          } else {
            $channel = "stable"
          }

          $infoVer = $tag.TrimStart('v', 'V')
          $numVer = ($infoVer -split '-')[0]
          Write-Host "Resolved tag=$tag channel=$channel infoVer=$infoVer numVer=$numVer"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "info_version=$infoVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "num_version=$numVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish single-file Windows client launcher
        run: >
          dotnet publish SoulspireLauncher/SoulspireLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.version.outputs.num_version }}
          -p:InformationalVersion=${{ steps.version.outputs.info_version }}
          -o publish/SoulspireLauncher

      - name: Publish standalone Windows updater helper (SoulspireUpdater.exe)
        run: >
          dotnet publish SoulspireUpdater/SoulspireUpdater.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.version.outputs.num_version }}
          -p:InformationalVersion=${{ steps.version.outputs.info_version }}
          -o publish/SoulspireUpdater

      - name: Package distributable archive and generate launcher-release.json metadata
        shell: pwsh
        env:
          SOULSPIRE_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.SOULSPIRE_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item "publish/SoulspireUpdater/SoulspireUpdater.exe" "publish/SoulspireLauncher/SoulspireUpdater.exe" -Force
          $sampleConfig = @'
          {
            "ServerName": "SoulspireXI",
            "DefaultHost": "play.soulspirexi.com",
            "UseHairpin": false,
            "LobbyPort": 54231,
            "SearchPort": 54002
          }
          '@
          Set-Content -Path "publish/SoulspireLauncher/soulspire-server.example.json" -Value $sampleConfig -Encoding UTF8
          Compress-Archive -Path "publish/SoulspireLauncher/SoulspireLauncher.exe", "publish/SoulspireLauncher/SoulspireUpdater.exe", "publish/SoulspireLauncher/soulspire-server.example.json" -DestinationPath "SoulspireLauncher-win-x64.zip" -Force
          if (-not (Test-Path "publish/SoulspireLauncher/SoulspireLauncher.exe")) { throw "Missing SoulspireLauncher.exe" }
          if (-not (Test-Path "publish/SoulspireLauncher/SoulspireUpdater.exe")) { throw "Missing SoulspireUpdater.exe" }
          if (Test-Path "publish/SoulspireLauncher/OverlordsLauncher.exe") { throw "Legacy OverlordsLauncher.exe must not be packaged in new releases" }
          if (-not (Test-Path "SoulspireLauncher-win-x64.zip")) { throw "Missing SoulspireLauncher-win-x64.zip" }

          $isReleasePublish = ("${{ github.ref }}" -like "refs/tags/v*") -or ("${{ inputs.publish_channel }}" -and "${{ inputs.publish_channel }}" -ne "none")
          $metaArgs = @(
            "scripts/build-launcher-release-metadata.py",
            "--channel", "${{ steps.version.outputs.channel }}",
            "--tag", "${{ steps.version.outputs.tag }}",
            "--package", "SoulspireLauncher-win-x64.zip",
            "--executable", "publish/SoulspireLauncher/SoulspireLauncher.exe",
            "--updater", "publish/SoulspireLauncher/SoulspireUpdater.exe",
            "--verify-public-key", "keys/soulspire-launcher-release-v1.pub.pem",
            "--release-notes", "Verified CI build ${{ steps.version.outputs.tag }} (${{ github.sha }})",
            "--output", "launcher-release.json"
          )
          if ($isReleasePublish) {
            # Fail closed: never produce unsigned metadata for any release tag or publish dispatch
            $metaArgs += "--require-signature"
          }
          & python @metaArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "launcher-release.json"

      - name: Verify Windows executable metadata and SoulspireXI identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $info = (Get-Item "publish/SoulspireLauncher/SoulspireLauncher.exe").VersionInfo
          Write-Host "ProductName=$($info.ProductName)"
          Write-Host "FileDescription=$($info.FileDescription)"
          Write-Host "CompanyName=$($info.CompanyName)"
          Write-Host "OriginalFilename=$($info.OriginalFilename)"
          Write-Host "FileVersion=$($info.FileVersion)"
          Write-Host "ProductVersion=$($info.ProductVersion)"
          if ($info.ProductName -notmatch 'SoulspireXI') { throw "Unexpected ProductName: $($info.ProductName)" }
          if ($info.FileDescription -notmatch 'SoulspireXI') { throw "Unexpected FileDescription: $($info.FileDescription)" }
          if ($info.CompanyName -notmatch 'SoulspireXI') { throw "Unexpected CompanyName: $($info.CompanyName)" }
          if ($info.ProductName -match 'Overlords' -or $info.FileDescription -match 'Overlords') { throw "Legacy Overlords branding found in executable metadata" }

          $updaterInfo = (Get-Item "publish/SoulspireLauncher/SoulspireUpdater.exe").VersionInfo
          Write-Host "UpdaterProductName=$($updaterInfo.ProductName)"
          if ($updaterInfo.ProductName -notmatch 'SoulspireXI') { throw "Unexpected Updater ProductName: $($updaterInfo.ProductName)" }

      - name: Upload launcher build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SoulspireLauncher-win-x64
          retention-days: 14
          path: |
            publish/SoulspireLauncher/SoulspireLauncher.exe
            publish/SoulspireLauncher/SoulspireUpdater.exe
            SoulspireLauncher-win-x64.zip
            launcher-release.json

  build-soulspire-native:
    needs: verify-manifest
    if: needs.verify-manifest.outputs.should_build_native == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build and self-test Soulspire Native (Win32 / x86, 32 hooks)
        shell: pwsh
        env:
          SOULSPIRE_NATIVE_KEEP_SELFTEST: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          & cmd.exe /c "call soulspire_native\build.cmd" 2>&1 | Tee-Object -FilePath "soulspire_native-build.log"
          $rc = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($rc -ne 0 -or -not (Test-Path "soulspire_native/selftest.exe")) {
            foreach ($line in (Get-Content "soulspire_native-build.log" | Select-String -Pattern '(error |warning |ERROR:|Assertion failed|fatal error)' | Select-Object -First 20)) {
              Write-Host "::error::$($line.Line)"
            }
            Get-Content "soulspire_native-build.log" -Tail 50
            if ($rc -eq 0) { $rc = 1 }
            exit $rc
          }

      - name: Verify built 32-bit soulspire_native.dll and write build metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $dllPath = "plugins/ashita4/soulspire_native.dll"
            $testPath = "soulspire_native/selftest.exe"
            if (-not (Test-Path $dllPath)) { throw "Missing built DLL: $dllPath" }
            if (-not (Test-Path $testPath)) { throw "Missing built selftest.exe: $testPath" }

            $dllBytes = [System.IO.File]::ReadAllBytes($dllPath)
            $dllHash = (Get-FileHash -Path $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $testBytes = [System.IO.File]::ReadAllBytes($testPath)
            $testHash = (Get-FileHash -Path $testPath -Algorithm SHA256).Hash.ToLowerInvariant()

            $regHash = "unknown"
            if (Test-Path "soulspire_native/registry/labels_generated.h") {
              $m = Select-String -Path "soulspire_native/registry/labels_generated.h" -Pattern 'kRegistryHash\s*=\s*"([^"]+)"'
              if ($m) { $regHash = $m.Matches[0].Groups[1].Value }
            }

            $provenance = [ordered]@{
              dllPath               = "plugins/ashita4/soulspire_native.dll"
              dllSha256             = $dllHash
              dllSize               = $dllBytes.Length
              expectedHooks         = 32
              abiVersion            = 2
              compiledRegistryHash  = $regHash
              runtimeIdentityLoader = $true
              identitySchemaVersion = 1
              searchRenderMode      = "menu2fon-soa-corners (mode 1)"
              sourceCommit          = "${{ github.sha }}"
              branch                = "${{ github.ref_name }}"
              ciRunId               = "${{ github.run_id }}"
              ciRunUrl              = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              buildTarget           = "Win32-x86-MSVC"
              ciVerified            = $true
              clientVerified        = $false
              notes                 = "CI-built 32-hook soulspire_native.dll (runtime PC Sub->Main FTABLE model resolver + native Commands menu entry) provenance. Never set clientVerified=true until verified in the Windows FFXI client."
            }
            $provenance | ConvertTo-Json -Depth 4 | Set-Content -Path "soulspire_native-provenance.json" -Encoding UTF8

            @(
              "commit_sha=${{ github.sha }}"
              "ref=${{ github.ref }}"
              "branch=${{ github.ref_name }}"
              "run_id=${{ github.run_id }}"
              "registry_hash=$regHash"
              "expected_hooks=32"
              "abi_version=2"
              "soulspire_native_dll_size=$($dllBytes.Length)"
              "soulspire_native_dll_sha256=$dllHash"
              "selftest_exe_size=$($testBytes.Length)"
              "selftest_exe_sha256=$testHash"
            ) | Set-Content -Path "soulspire_native-build-info.txt" -Encoding UTF8

            $ErrorActionPreference = 'Continue'
            $verifyOut = (& python scripts/verify-soulspire-native-dll.py $dllPath --build-info soulspire_native-build-info.txt --expected-commit "${{ github.sha }}" 2>&1)
            $vrc = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            $verifyOut | ForEach-Object { Write-Host $_ }
            if ($vrc -ne 0) {
              $joined = ($verifyOut | ForEach-Object { $_.ToString() }) -join ' | '
              Write-Host "::error::verify-soulspire-native-dll failed (rc=$vrc): $joined"
              exit $vrc
            }
            Get-Content "soulspire_native-build-info.txt"
          } catch {
            Write-Host "::error::Step 5 exception: $($_.Exception.Message)"
            throw
          }
      - name: Upload soulspire_native.dll and selftest.exe build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: soulspire-native-win-x86
          retention-days: 14
          path: |
            plugins/ashita4/soulspire_native.dll
            soulspire_native/selftest.exe
            soulspire_native-build-info.txt
            soulspire_native-provenance.json
            soulspire_native-build.log

  build-testing-channel:
    needs: [verify-manifest, build-and-test]
    if: needs.verify-manifest.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build and self-test 31-hook soulspire_native.dll (Win32 / x86)
        shell: pwsh
        env:
          SOULSPIRE_NATIVE_KEEP_SELFTEST: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          & cmd.exe /c "soulspire_native\build.cmd 2>&1" | Tee-Object -FilePath "soulspire_native-testing-build.log"
          $rc = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($rc -ne 0) {
            Get-Content "soulspire_native-testing-build.log" -Tail 40
            exit $rc
          }

      - name: Verify 31-hook soulspire_native.dll and build Testing channel manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dllPath = "plugins/ashita4/soulspire_native.dll"
          $hash = (Get-FileHash -Path $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $dllPath).Length
          @(
            "commit_sha=${{ github.sha }}"
            "ref=${{ github.ref }}"
            "branch=${{ github.ref_name }}"
            "run_id=${{ github.run_id }}"
            "soulspire_native_dll_size=$size"
            "soulspire_native_dll_sha256=$hash"
          ) | Set-Content -Path "soulspire_native-testing-build-info.txt" -Encoding UTF8

          python scripts/verify-soulspire-native-dll.py $dllPath --build-info soulspire_native-testing-build-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/publish-testing-channel.py `
            --native-dll $dllPath `
            --build-info soulspire_native-testing-build-info.txt `
            --modern-client-json channels/testing/modern-client.json `
            --manifest-version "2.2.99-testing.1" `
            --server-version "${{ github.ref_name }} (${{ github.sha }})" `
            --server-branch "main" `
            --server-commit "${{ github.sha }}" `
            --server-image "soulspirexi/server:main" `
            --repo-branch "main" `
            --native-hooks 32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python scripts/verify-launcher-manifest.py --manifest channels/testing/manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload verified Testing channel package artifact
        uses: actions/upload-artifact@v7
        with:
          name: SoulspireXI-Testing-Channel-Package
          retention-days: 14
          path: |
            channels/testing/manifest.json
            channels/testing/payload/plugins/ashita4/soulspire_native.dll
            soulspire_native-testing-build-info.txt
            soulspire_native-testing-build.log

  sync-soulspire-native-binary:
    needs: [verify-manifest, build-and-test, build-soulspire-native]
    if: (github.ref == 'refs/heads/feat/soulspire-native-foundation' || github.ref == 'refs/heads/feat/dat-virtualization-poc' || github.ref == 'refs/heads/feat/berserker-dual-great-axe' || github.ref == 'refs/heads/feat/soulspire-core-native-ui-gamepad' || github.ref == 'refs/heads/fix/ws3-weap-002-equip-sync-diag' || github.ref == 'refs/heads/fix/ws3-weap-002-hook27-allow-resume' || github.ref == 'refs/heads/feat/ws3-weap-002-render-xref-probe' || startsWith(github.ref, 'refs/heads/feat/ws3-weap-002-')) && !startsWith(github.event.head_commit.message, 'chore(soulspire-native):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download verified Windows x86 soulspire-native-win-x86 artifact
        uses: actions/download-artifact@v8
        with:
          name: soulspire-native-win-x86
          path: ci-native

      - name: Sync soulspire_native.dll, dll_sync_state.json, and manifest.json
        shell: bash
        run: |
          set -euo pipefail
          cp ci-native/plugins/ashita4/soulspire_native.dll plugins/ashita4/soulspire_native.dll
          python scripts/verify-soulspire-native-dll.py \
            plugins/ashita4/soulspire_native.dll \
            --build-info ci-native/soulspire_native-build-info.txt

          python - <<'PY'
          import json
          from pathlib import Path
          prov = json.loads(Path("ci-native/soulspire_native-provenance.json").read_text(encoding="utf-8-sig"))
          state_path = Path("soulspire_native/dll_sync_state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state.update({
              "dllPath": "plugins/ashita4/soulspire_native.dll",
              "dllSha256": prov["dllSha256"],
              "dllSize": prov["dllSize"],
              "compiledRegistryHash": prov["compiledRegistryHash"],
              "nativeHooks": 32,
              "expectedHooks": 32,
              "abiVersion": 2,
              "runtimeIdentityLoader": True,
              "identitySchemaVersion": 1,
              "sourceCommit": prov["sourceCommit"],
              "branch": prov["branch"],
              "ciRunId": prov["ciRunId"],
              "ciRunUrl": prov["ciRunUrl"],
              "ciVerified": True,
              "clientVerified": False,
              "notes": "CI-built 32-hook soulspire_native.dll (runtime PC Sub->Main FTABLE model resolver + native Commands menu entry) synced from GitHub Actions windows-latest MSVC x86 build. Client verification requires manual Windows Ashita v4 playtesting.",
          })
          state_path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")
          PY

          python scripts/update-launcher-manifest.py
          python scripts/verify-launcher-manifest.py
          python scripts/verify-soulspire-native-dll.py plugins/ashita4/soulspire_native.dll --manifest manifest.json

      - name: Commit and push synced soulspire_native.dll to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/ashita4/soulspire_native.dll soulspire_native/dll_sync_state.json manifest.json
          if git diff --cached --quiet; then
            echo "No binary/manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(soulspire-native): sync CI-verified 32-hook soulspire_native.dll"
          git push origin "HEAD:${{ github.ref_name }}"

  sync-testing-native-binary:
    needs: [verify-manifest, build-and-test, build-soulspire-native]
    if: github.ref == 'refs/heads/feat/client-modern-001-vanacore-compat' && !startsWith(github.event.head_commit.message, 'chore(soulspire-native):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download verified Windows x86 soulspire-native-win-x86 artifact
        uses: actions/download-artifact@v8
        with:
          name: soulspire-native-win-x86
          path: ci-native

      - name: Sync Testing-only soulspire_native.dll and channels/testing/manifest.json (preserves Stable)
        shell: bash
        run: |
          set -euo pipefail
          cp ci-native/plugins/ashita4/soulspire_native.dll channels/testing/payload/plugins/ashita4/soulspire_native.dll
          python scripts/verify-soulspire-native-dll.py \
            channels/testing/payload/plugins/ashita4/soulspire_native.dll \
            --build-info ci-native/soulspire_native-build-info.txt

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          dll = Path("channels/testing/payload/plugins/ashita4/soulspire_native.dll")
          data = dll.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          size = len(data)
          mf_path = Path("channels/testing/manifest.json")
          mf = json.loads(mf_path.read_text(encoding="utf-8"))
          mf["manifestVersion"] = "2.2.3-testing.7"
          if isinstance(mf.get("serverCompatibility"), dict):
              mf["serverCompatibility"]["notes"] = (
                  "Unified canonical Testing payload (2.2.3-testing.7): Phase 2B VanaCore callee-detour support "
                  "(0x1CAD80/0x121110/0x120FF0) + soulspire_native.log, Soulforge sibling module sync "
                  "(soulspire_talents), live Soul HUD (soulspire_soulhud), kazenoeye + [OXMOB]| chat leak suppression."
              )
          updated = 0
          for entry in mf.get("files", []):
              if entry.get("sourcePath") == "channels/testing/payload/plugins/ashita4/soulspire_native.dll":
                  entry["sha256"] = sha
                  entry["size"] = size
                  updated += 1
          assert updated == 1, f"Expected 1 testing soulspire_native.dll entry, updated {updated}"
          if isinstance(mf.get("registry"), dict):
              mf["registry"]["nativeDllSha256"] = sha
          mf_path.write_text(json.dumps(mf, indent=2) + "\n", encoding="utf-8")
          print(f"Synced Testing soulspire_native.dll: sha256={sha} size={size}")
          PY

          python scripts/verify-launcher-manifest.py --manifest channels/testing/manifest.json
          python scripts/verify-launcher-manifest.py --manifest manifest.json

      - name: Commit and push synced Testing-only soulspire_native.dll
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels/testing/payload/plugins/ashita4/soulspire_native.dll channels/testing/manifest.json
          if git diff --cached --quiet; then
            echo "No Testing native DLL changes to commit."
            exit 0
          fi
          git commit -m "chore(soulspire-native): sync Testing-only 32-hook soulspire_native.dll for v2.2.3-testing.7"
          git push origin "HEAD:${{ github.ref_name }}"

  publish-release:
    needs: [verify-manifest, build-and-test, build-soulspire-native]
    concurrency:
      group: canonical-release-publish
      cancel-in-progress: false
    if: >-
      always() &&
      needs.verify-manifest.result == 'success' &&
      needs.build-and-test.result == 'success' &&
      (needs.build-soulspire-native.result == 'success' || needs.build-soulspire-native.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_channel != 'none'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted public key and verifier
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            keys
            scripts/build-launcher-release-metadata.py

      - name: Download launcher build artifact
        uses: actions/download-artifact@v8
        with:
          name: SoulspireLauncher-win-x64
          path: release-assets

      - name: Verify release assets, hashes, and ECDSA signature (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/publish/SoulspireLauncher/SoulspireLauncher.exe
          test -s release-assets/publish/SoulspireLauncher/SoulspireUpdater.exe
          test ! -e release-assets/publish/SoulspireLauncher/OverlordsLauncher.exe
          test -s release-assets/SoulspireLauncher-win-x64.zip
          test -s release-assets/launcher-release.json
          python3 scripts/build-launcher-release-metadata.py \
            --verify-only release-assets/launcher-release.json \
            --verify-public-key keys/soulspire-launcher-release-v1.pub.pem \
            --package release-assets/SoulspireLauncher-win-x64.zip \
            --executable release-assets/publish/SoulspireLauncher/SoulspireLauncher.exe \
            --updater release-assets/publish/SoulspireLauncher/SoulspireUpdater.exe

      - name: Determine and validate release channel (Stable vs Testing prerelease)
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          META_TAG="$(python3 -c 'import json; print(json.load(open("release-assets/launcher-release.json"))["tag"])')"
          META_CHANNEL="$(python3 -c 'import json; print(json.load(open("release-assets/launcher-release.json"))["channel"])')"
          echo "tag=${META_TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${META_CHANNEL}" >> "$GITHUB_OUTPUT"

          if [[ "${META_CHANNEL}" == "stable" ]]; then
            # Guard: Stable releases may ONLY come from main or a non-prerelease tag pointing to main
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "ERROR: Refusing to publish a Stable release from non-main branch ${{ github.ref }}." >&2
              exit 1
            fi
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish permanent GitHub Release with verified launcher-release.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/publish/SoulspireLauncher/SoulspireLauncher.exe
            release-assets/publish/SoulspireLauncher/SoulspireUpdater.exe
            release-assets/SoulspireLauncher-win-x64.zip
            release-assets/launcher-release.json
