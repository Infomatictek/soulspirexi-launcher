name: Build Client Launcher

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-launcher-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
      should_build_crystaljobs: ${{ steps.changes.outputs.should_build_crystaljobs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run manifest verification unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Ashita Lua unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'lupa==2.8'
          python tests/run_soul_lua_tests.py

      - name: Verify launcher manifest (strict read-only)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-launcher-manifest.py
          git diff --exit-code

      - name: Determine whether Windows builds are required
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_build_crystaljobs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi

          if [[ -z "$base_ref" ]] || [[ "$base_ref" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_build_crystaljobs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base_ref" HEAD)"
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -Eq '^(SoulspireLauncher/|SoulspireLauncher\.Tests/|SoulspireLauncher\.sln|manifest\.json|dat-overlay/|addons/|plugins/|native/crystaljobs/|scripts/|tests/|\.github/workflows/build-launcher\.yml)'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No launcher/client/manifest files changed; skipping redundant Windows launcher build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" | grep -Eq '^(native/crystaljobs/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|def|cmd|bat|ps1)|\.github/workflows/build-launcher\.yml|scripts/publish-testing-channel\.py|scripts/verify-launcher-manifest\.py)$'; then
            echo "should_build_crystaljobs=true" >> "$GITHUB_OUTPUT"
          else
            echo "No native/crystaljobs C++ source files changed; skipping crystaljobs.dll build."
            echo "should_build_crystaljobs=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: verify-manifest
    if: needs.verify-manifest.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore SoulspireLauncher.sln

      - name: Build solution
        run: dotnet build SoulspireLauncher.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test SoulspireLauncher.sln -c Release --no-build --verbosity normal

      - name: Publish single-file Windows client launcher
        run: >
          dotnet publish SoulspireLauncher/SoulspireLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o publish/SoulspireLauncher

      - name: Package distributable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sampleConfig = @'
          {
            "ServerName": "SoulspireXI",
            "DefaultHost": "play.soulspirexi.com",
            "UseHairpin": false,
            "LobbyPort": 54231,
            "SearchPort": 54002
          }
          '@
          Set-Content -Path "publish/SoulspireLauncher/soulspire-server.example.json" -Value $sampleConfig -Encoding UTF8
          Compress-Archive -Path "publish/SoulspireLauncher/SoulspireLauncher.exe", "publish/SoulspireLauncher/soulspire-server.example.json" -DestinationPath "SoulspireLauncher-win-x64.zip" -Force
          if (-not (Test-Path "publish/SoulspireLauncher/SoulspireLauncher.exe")) { throw "Missing SoulspireLauncher.exe" }
          if (Test-Path "publish/SoulspireLauncher/OverlordsLauncher.exe") { throw "Legacy OverlordsLauncher.exe must not be packaged in new releases" }
          if (-not (Test-Path "SoulspireLauncher-win-x64.zip")) { throw "Missing SoulspireLauncher-win-x64.zip" }

      - name: Verify Windows executable metadata and SoulspireXI identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $info = (Get-Item "publish/SoulspireLauncher/SoulspireLauncher.exe").VersionInfo
          Write-Host "ProductName=$($info.ProductName)"
          Write-Host "FileDescription=$($info.FileDescription)"
          Write-Host "CompanyName=$($info.CompanyName)"
          Write-Host "OriginalFilename=$($info.OriginalFilename)"
          Write-Host "FileVersion=$($info.FileVersion)"
          if ($info.ProductName -notmatch 'SoulspireXI') { throw "Unexpected ProductName: $($info.ProductName)" }
          if ($info.FileDescription -notmatch 'SoulspireXI') { throw "Unexpected FileDescription: $($info.FileDescription)" }
          if ($info.CompanyName -notmatch 'SoulspireXI') { throw "Unexpected CompanyName: $($info.CompanyName)" }
          if ($info.ProductName -match 'Overlords' -or $info.FileDescription -match 'Overlords') { throw "Legacy Overlords branding found in executable metadata" }

      - name: Upload launcher build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SoulspireLauncher-win-x64
          retention-days: 14
          path: |
            publish/SoulspireLauncher/SoulspireLauncher.exe
            SoulspireLauncher-win-x64.zip

  build-crystaljobs:
    needs: verify-manifest
    if: needs.verify-manifest.outputs.should_build_crystaljobs == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and self-test Candidate C (aligned native_text) and Candidate A (legacy 4f0fdb3 native_text)
        shell: pwsh
        env:
          CRYSTALJOBS_KEEP_SELFTEST: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-CrystalJobsBuild([string]$extraFlags, [string]$outDir, [string]$logFile) {
            $env:CRYSTALJOBS_EXTRA_CXXFLAGS = $extraFlags
            $ErrorActionPreference = 'Continue'
            & cmd.exe /c "native\crystaljobs\build.cmd 2>&1" | Tee-Object -FilePath $logFile
            $rc = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($rc -ne 0) {
              $tail = (Get-Content $logFile -Tail 40) -join "`n"
              foreach ($line in (Get-Content $logFile | Select-String -Pattern '(error |ERROR:|Assertion failed|fatal error)' | Select-Object -First 10)) {
                Write-Host "::error::$($line.Line)"
              }
              if (-not (Get-Content $logFile | Select-String -Pattern '(error |ERROR:|Assertion failed|fatal error)')) {
                Write-Host "::error::build.cmd ($extraFlags) exited with code $rc. Last lines: $tail"
              }
              exit $rc
            }
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            Copy-Item -Force "plugins/ashita4/crystaljobs.dll" (Join-Path $outDir "crystaljobs.dll")
            Copy-Item -Force "native/crystaljobs/selftest.exe" (Join-Path $outDir "selftest.exe")
          }

          # Candidate A: Historical working implementation (4f0fdb3 single-call native_text)
          Invoke-CrystalJobsBuild "/DCRYSTALJOBS_SEARCH_RENDER_MODE=0" "ci-builds/search-legacy-text" "crystaljobs-legacy-build.log"
          # Candidate C: Safe default repair (fixed-column aligned native_text)
          Invoke-CrystalJobsBuild "/DCRYSTALJOBS_SEARCH_RENDER_MODE=2" "ci-builds/search-aligned-text" "crystaljobs-build.log"

      - name: Verify built 32-bit binaries and write build metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Win32PE([string]$path) {
            if (-not (Test-Path $path)) { throw "Missing built binary: $path" }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Invalid PE header (missing MZ) in $path"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x014C) {
              throw ("Expected x86 (0x014C) PE machine type in $path, got 0x{0:X4}" -f $machine)
            }
            $hash = (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Verified 32-bit PE binary: $path ($($bytes.Length) bytes, sha256=$hash)"
            return @{ Size = $bytes.Length; Sha256 = $hash }
          }

          $regHash = "unknown"
          if (Test-Path "native/crystaljobs/labels_generated.h") {
            $m = Select-String -Path "native/crystaljobs/labels_generated.h" -Pattern 'kRegistryHash\s*=\s*"([^"]+)"'
            if ($m) { $regHash = $m.Matches[0].Groups[1].Value }
          }

          function Write-CandidateMetadata([string]$dllPath, [string]$testPath, [string]$modeLabel, [string]$provOut, [string]$infoOut) {
            $dllInfo = Assert-Win32PE $dllPath
            $testInfo = Assert-Win32PE $testPath
            $provenance = [ordered]@{
              dllPath              = "plugins/ashita4/crystaljobs.dll"
              dllSha256            = $dllInfo.Sha256
              dllSize              = $dllInfo.Size
              compiledRegistryHash = $regHash
              searchRenderMode     = $modeLabel
              sourceCommit         = "${{ github.sha }}"
              branch               = "${{ github.ref_name }}"
              ciRunId              = "${{ github.run_id }}"
              ciRunUrl             = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              buildTarget          = "Win32-x86-MSVC"
              ciVerified           = $true
              clientVerified       = $false
              notes                = "CI-built crystaljobs.dll provenance ($modeLabel). Never set clientVerified=true until verified in the Windows FFXI client."
            }
            $provenance | ConvertTo-Json -Depth 4 | Set-Content -Path $provOut -Encoding UTF8
            @(
              "commit_sha=${{ github.sha }}"
              "ref=${{ github.ref }}"
              "branch=${{ github.ref_name }}"
              "run_id=${{ github.run_id }}"
              "registry_hash=$regHash"
              "search_render_mode=$modeLabel"
              "crystaljobs_dll_size=$($dllInfo.Size)"
              "crystaljobs_dll_sha256=$($dllInfo.Sha256)"
              "selftest_exe_size=$($testInfo.Size)"
              "selftest_exe_sha256=$($testInfo.Sha256)"
            ) | Set-Content -Path $infoOut -Encoding UTF8
            return $dllInfo
          }

          $alignedInfo = Write-CandidateMetadata "ci-builds/search-aligned-text/crystaljobs.dll" "ci-builds/search-aligned-text/selftest.exe" "aligned-native-text (mode 2)" "ci-builds/search-aligned-text/crystaljobs-provenance.json" "ci-builds/search-aligned-text/crystaljobs-build-info.txt"
          $legacyInfo  = Write-CandidateMetadata "ci-builds/search-legacy-text/crystaljobs.dll" "ci-builds/search-legacy-text/selftest.exe" "legacy-native-text-4f0fdb3 (mode 0)" "ci-builds/search-legacy-text/crystaljobs-provenance.json" "ci-builds/search-legacy-text/crystaljobs-build-info.txt"
          if ($alignedInfo.Sha256 -eq $legacyInfo.Sha256) {
            throw "Candidate A (legacy) and Candidate C (aligned) produced identical DLL SHA-256 hashes!"
          }
          Copy-Item -Force "ci-builds/search-aligned-text/crystaljobs-provenance.json" "crystaljobs-provenance.json"
          Copy-Item -Force "ci-builds/search-aligned-text/crystaljobs-build-info.txt" "crystaljobs-build-info.txt"
          Get-Content "crystaljobs-build-info.txt"

      - name: Upload crystaljobs.dll and selftest.exe build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: crystaljobs-win-x86
          retention-days: 14
          path: |
            plugins/ashita4/crystaljobs.dll
            native/crystaljobs/selftest.exe
            crystaljobs-build-info.txt
            crystaljobs-provenance.json
            crystaljobs-build.log
            crystaljobs-legacy-build.log
            ci-builds/search-legacy-text/
            ci-builds/search-aligned-text/

  build-testing-channel:
    needs: [verify-manifest, build-and-test]
    if: needs.verify-manifest.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Checkout 27-hook CrystalJobs source from feat/soul-weapon-templates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/soul-weapon-templates
          git checkout origin/feat/soul-weapon-templates -- native/crystaljobs

      - name: Build and self-test 27-hook crystaljobs.dll (Win32 / x86)
        shell: pwsh
        env:
          CRYSTALJOBS_KEEP_SELFTEST: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          & cmd.exe /c "native\crystaljobs\build.cmd 2>&1" | Tee-Object -FilePath "crystaljobs-testing-build.log"
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            Get-Content "crystaljobs-testing-build.log" -Tail 40
            exit $rc
          }

      - name: Verify 27-hook crystaljobs.dll and build Testing channel manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dllPath = "plugins/ashita4/crystaljobs.dll"
          $hash = (Get-FileHash -Path $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $dllPath).Length
          $templatesCommit = (git rev-parse origin/feat/soul-weapon-templates).Trim()
          @(
            "commit_sha=$templatesCommit"
            "ref=refs/heads/feat/soul-weapon-templates"
            "branch=feat/soul-weapon-templates"
            "run_id=${{ github.run_id }}"
            "crystaljobs_dll_size=$size"
            "crystaljobs_dll_sha256=$hash"
          ) | Set-Content -Path "crystaljobs-testing-build-info.txt" -Encoding UTF8

          python scripts/verify-crystaljobs-dll.py $dllPath --build-info crystaljobs-testing-build-info.txt
          python scripts/publish-testing-channel.py `
            --crystaljobs-dll $dllPath `
            --build-info crystaljobs-testing-build-info.txt `
            --manifest-version "2.1.0-testing.1" `
            --server-version "feat/soul-weapon-templates (b05c027 / patch 0074)" `
            --server-branch "feat/soul-weapon-templates" `
            --server-commit "b05c027" `
            --server-image "soulspirexi/server:feat-soul-weapon-templates" `
            --crystaljobs-hooks 27

          # Verify Testing manifest strictly and confirm Stable manifest.json was untouched
          python scripts/verify-launcher-manifest.py --manifest channels/testing/manifest.json
          git checkout -- plugins/ashita4/crystaljobs.dll native/crystaljobs
          python scripts/verify-launcher-manifest.py

      - name: Upload verified Testing channel package artifact
        uses: actions/upload-artifact@v7
        with:
          name: SoulspireXI-Testing-Channel-Package
          retention-days: 14
          path: |
            channels/testing/manifest.json
            channels/testing/payload/plugins/ashita4/crystaljobs.dll
            crystaljobs-testing-build-info.txt
            crystaljobs-testing-build.log

  publish-registry-24hook-candidate:
    needs: [verify-manifest, build-crystaljobs, build-and-test]
    if: github.ref == 'refs/heads/feat/soul-identity-registry-integration' && !startsWith(github.event.head_commit.message, 'chore(testing-candidate):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/soul-identity-registry-integration
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download verified Windows x86 crystaljobs-win-x86 artifact
        uses: actions/download-artifact@v8
        with:
          name: crystaljobs-win-x86
          path: ci-crystaljobs

      - name: Verify DLL provenance, registry hash, architecture, and exports for Candidates A and C
        shell: bash
        run: |
          set -euo pipefail
          for cand in search-legacy-text search-aligned-text; do
            python scripts/verify-crystaljobs-dll.py \
              "ci-crystaljobs/ci-builds/${cand}/crystaljobs.dll" \
              --allow-24-hook \
              --build-info "ci-crystaljobs/ci-builds/${cand}/crystaljobs-build-info.txt"
          done

          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path("registry_sync.json").read_text(encoding="utf-8"))
          seen_shas = set()
          for cand in ("search-legacy-text", "search-aligned-text"):
              prov = json.loads(Path(f"ci-crystaljobs/ci-builds/{cand}/crystaljobs-provenance.json").read_text(encoding="utf-8-sig"))
              assert prov["compiledRegistryHash"] == reg["registryHash"], (
                  f"{cand} registry hash mismatch: dll={prov['compiledRegistryHash']} vs sync={reg['registryHash']}"
              )
              assert prov["clientVerified"] is False, f"{cand} provenance must keep clientVerified=false"
              assert prov["dllSha256"] not in seen_shas, f"Duplicate DLL sha256 across candidates: {prov['dllSha256']}"
              seen_shas.add(prov["dllSha256"])
              print(f"Verified {cand}: sha256={prov['dllSha256']} mode={prov.get('searchRenderMode')} registryHash={prov['compiledRegistryHash']}")
          PY

      - name: Publish isolated Candidate A (search-legacy-text) and Candidate C (search-aligned-text) manifests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish-testing-channel.py \
            --candidate search-legacy-text \
            --crystaljobs-dll ci-crystaljobs/ci-builds/search-legacy-text/crystaljobs.dll \
            --build-info ci-crystaljobs/ci-builds/search-legacy-text/crystaljobs-build-info.txt \
            --provenance-json ci-crystaljobs/ci-builds/search-legacy-text/crystaljobs-provenance.json \
            --repo-branch feat/soul-identity-registry-integration \
            --manifest-version "2.1.5-testing.search-legacy-text" \
            --server-version "feat/soul-identity-registry-integration (6e4311c)" \
            --server-branch "feat/soul-identity-registry-integration" \
            --server-commit "6e4311c" \
            --server-image "soulspirexi/server:registry" \
            --crystaljobs-hooks 24 \
            --notes "Candidate A (Historical 4f0fdb3): 24-hook Approved 66-Soul Registry (0e3278fac7296cb3) with legacy single-call 0.75x native_text Search labels (zero menu2fon sprite mutation)"

          python scripts/publish-testing-channel.py \
            --candidate search-aligned-text \
            --crystaljobs-dll ci-crystaljobs/ci-builds/search-aligned-text/crystaljobs.dll \
            --build-info ci-crystaljobs/ci-builds/search-aligned-text/crystaljobs-build-info.txt \
            --provenance-json ci-crystaljobs/ci-builds/search-aligned-text/crystaljobs-provenance.json \
            --repo-branch feat/soul-identity-registry-integration \
            --manifest-version "2.1.5-testing.search-aligned-text" \
            --server-version "feat/soul-identity-registry-integration (6e4311c)" \
            --server-branch "feat/soul-identity-registry-integration" \
            --server-commit "6e4311c" \
            --server-image "soulspirexi/server:registry" \
            --crystaljobs-hooks 24 \
            --notes "Candidate C (Repair): 24-hook Approved 66-Soul Registry (0e3278fac7296cb3) with fixed-column aligned native_text Search labels (readable first, zero menu2fon sprite mutation)"

          python scripts/verify-launcher-manifest.py --manifest channels/testing-search-legacy-text/manifest.json
          python scripts/verify-launcher-manifest.py --manifest channels/testing-search-aligned-text/manifest.json
          python scripts/verify-launcher-manifest.py --manifest channels/testing-registry-24hook/manifest.json
          git diff --exit-code manifest.json

      - name: Commit and push isolated Search testing candidates to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels/testing-search-legacy-text/ channels/testing-search-aligned-text/
          if git diff --cached --quiet; then
            echo "No changes to Search testing candidates."
            exit 0
          fi
          git commit -m "chore(testing-candidate): publish isolated Search A (legacy) and C (aligned) crystaljobs.dll (2.1.5)"
          git push origin HEAD:feat/soul-identity-registry-integration

  publish-release:
    needs: [build-and-test, build-crystaljobs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download launcher build artifact
        uses: actions/download-artifact@v8
        with:
          name: SoulspireLauncher-win-x64
          path: release-assets

      - name: Verify release assets exist (and no legacy OverlordsLauncher.exe)
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/publish/SoulspireLauncher/SoulspireLauncher.exe
          test ! -e release-assets/publish/SoulspireLauncher/OverlordsLauncher.exe
          test -s release-assets/SoulspireLauncher-win-x64.zip

      - name: Determine release channel (Stable vs Testing prerelease)
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_name }}" == *"-testing"* ]] || [[ "${{ github.ref_name }}" == *"-rc"* ]] || [[ "${{ github.ref_name }}" == *"-beta"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release on tag
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/publish/SoulspireLauncher/SoulspireLauncher.exe
            release-assets/SoulspireLauncher-win-x64.zip
