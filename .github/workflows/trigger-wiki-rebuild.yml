name: Trigger SoulspireXI Wiki Rebuild

on:
  push:
    branches:
      - main
    paths:
      - 'addons/ashita4/soulspire_soul_actions/data/soul_actions.tsv'
      - 'addons/ashita4/soulspire_soul_actions/data/visibility.tsv'
      - 'scripts/validate-soul-actions-tsv.py'
      - '.github/workflows/trigger-wiki-rebuild.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'addons/ashita4/soulspire_soul_actions/data/soul_actions.tsv'
      - 'addons/ashita4/soulspire_soul_actions/data/visibility.tsv'
      - 'scripts/validate-soul-actions-tsv.py'
      - '.github/workflows/trigger-wiki-rebuild.yml'
  workflow_dispatch:

concurrency:
  group: trigger-wiki-rebuild-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate-soul-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate Soul action and visibility TSV catalogs
        run: python scripts/validate-soul-actions-tsv.py

  dispatch-wiki-rebuild:
    needs: validate-soul-actions
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch update-wiki.yml in Infomatictek/soulspirexi
        env:
          WIKI_DISPATCH_TOKEN: ${{ secrets.WIKI_DISPATCH_TOKEN }}
          LAUNCHER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WIKI_DISPATCH_TOKEN:-}" ]; then
            echo "::warning::Secret WIKI_DISPATCH_TOKEN is not configured in Infomatictek/soulspirexi-launcher. Add a fine-grained PAT scoped only to Infomatictek/soulspirexi with 'Actions: Read and write' permission to enable automatic cross-repo wiki rebuilds."
            exit 0
          fi

          http_code="$(curl -sS -o /tmp/dispatch_resp.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WIKI_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Infomatictek/soulspirexi/actions/workflows/update-wiki.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"launcher_ref\":\"${LAUNCHER_SHA}\"}}")"

          if [ "$http_code" != "204" ]; then
            echo "::error::Failed to dispatch wiki rebuild (HTTP ${http_code}): $(cat /tmp/dispatch_resp.txt)"
            exit 1
          fi
          echo "Successfully dispatched Infomatictek/soulspirexi update-wiki.yml for launcher commit ${LAUNCHER_SHA}."
